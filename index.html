<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="app.js"></script>
    <h1>Calculator</h1>
    <div class="calculator">
        <input id="output" class="display" type="number" id="display" readonly>
        <div class="buttons">
            <!-- Row 1 -->
            <button id="parenthesis open" class="btn adv-operators" data-value="("> (</button>
            <button id="parenthesis close" class="btn adv-operators" data-value=")">)</button>
            <button id="memory clear" class="btn adv-operators" data-value="memory clear">mc</button>
            <button id="memory add" class="btn adv-operators" data-value="memory add">m+</button>
            <button id="memory subtract" class="btn adv-operators" data-value="memory subtract">m-</button>
            <button id="memory recall" class="btn adv-operators" data-value="recall memory">mr</button>
            <button id="" class="btn adv-operators">del</button>
            <button id="clear" class="btn adv-operators" data-value="C">C</button>
            <button id="percent" class="btn" data-value="%">%</button>
            <button id="divide" class="btn bsc-operators" data-value="/">÷</button>

            <!-- Row 2 -->
            <button id="2nd" class="btn adv-operators" data-value="2nd">2nd</button>
            <button id="x^2" class="btn adv-operators" data-value="x^2">x²</button>
            <button id="x^3" class="btn adv-operators" data-value="x^3">x³</button>
            <button id="x^y" class="btn adv-operators" data-value="x^y">xʸ</button>
            <button id="e^x" class="btn adv-operators" data-value="e^x">eˣ</button>
            <button id="10^x" class="btn adv-operators" data-value="10^x">10ˣ</button>
            <button id="7" class="btn numbers" data-value="7">7</button>
            <button id="8" class="btn numbers" data-value="8">8</button>
            <button id="9" class="btn numbers" data-value="9">9</button>
            <button id="multiply" class="btn bsc-operators" data-value="*">×</button>

            <!-- Row 3 -->
            <button id="reciprocal" class="btn adv-operators" data-value="reciprocal">1/x</button>
            <button id="root square" class="btn adv-operators" data-value="sqrt">²√x</button>
            <button id="root cube" class="btn adv-operators" data-value="root cube">³√x</button>
            <button id="root arbituary" class="btn adv-operators" data-value="sqrt">ʸ√x</button>
            <button id="ln" class="btn adv-operators" data-value="ln">ln</button>
            <button id="log10" class="btn adv-operators" data-value="log10">log₁₀</button>
            <button id="4" class="btn numbers" data-value="4">4</button>
            <button id="5" class="btn numbers" data-value="5">5</button>
            <button id="6" class="btn numbers" data-value="6">6</button>
            <button id="subtract" class="btn bsc-operators" data-value="-">-</button>

            <!-- Row 4 -->
            
            <button id="factorial" class="btn adv-operators" data-value="factorial">x!</button>
            <button id="sine" class="btn adv-operators" data-value="sin">sin</button>
            <button id="cosine" class="btn adv-operators" data-value="cos">cos</button>
            <button id="tangent" class="btn adv-operators" data-value="tan">tan</button>
            <button id="e" class="btn adv-operators" data-value="e">e</button>
            <button id="scientific" class="btn adv-operators" data-value="EE">EE</button>
            <button id="1" class="btn numbers" data-value="1">1</button>
            <button id="2" class="btn numbers" data-value="2">2</button>
            <button id="3" class="btn numbers" data-value="3">3</button>
            <button id="add" class="btn bsc-operators" data-value="+">+</button>

            <!-- Row 5 -->
            <button id="" class="btn adv-operators"></button>
            <button id="sine hyperbolic" class="btn adv-operators" data-value="sinh">sinh</button>
            <button id="cosine hyperbolic" class="btn adv-operators" data-value="cosh">cosh</button>
            <button id="tangent hyperbolic" class="btn adv-operators" data-value="tanh">tanh</button>
            <button id="pi" class="btn adv-operators" data-value="pi">π</button>
            <button id="" class ="btn adv-operators">Rad</button>
            <button id="value sign" class="btn numbers" data-value="+/-">+/-</button>
            <button id="0" class="btn numbers" data-value="0">0</button>
            <button id="decimal" class="btn numbers" data-value=".">.</button>
            <button id="equals" class="btn bsc-operators" data-value="=">=</button>
        </div>
    </div>
</body>
</html>
